
name = 'NAME-Here'
model_type = 'image'
scale = 2 
use_amp = true
bfloat16 = true
fast_matmul = true
[datasets.train]
type = 'CachedSRDataset'
dataroot_gt = 'GT IMAGES' 
dataroot_lq = 'LQ IMAGES'
patch_size = 96
batch_size = 32
accumulate = 1
augmentation = [ 'resizemix', 'cutblur']    # 'mixup', 'cutmix', 'resizemix', 'cutblur'
aug_prob = [ 0.25, 0.15 ]
use_hflip = true
use_rot = true


[datasets.val]
name = 'val'
type = 'paired'
dataroot_gt = 'GT IMAGES' 
dataroot_lq = 'LQ IMAGES'

[val]
val_freq = 5000
[val.metrics.psnr]
type = 'calculate_psnr'

[train]
ema = 0.995
match_lq_colors = false

[network_g]
type = 'GRDFNet'
num_sets = 3
feature_channels = 32

[train.scheduler]
type = 'cosineannealing'
T_max = 150000
eta_min = 1e-9 

[train.optim_g]
type = 'adam'
lr = 1e-4                    
betas = [0.9, 0.999]
weight_decay = 5e-7

[train.pixel_opt]
type = 'HuberLoss'
loss_weight = 1.0
reduction = 'mean'

[train.gw_opt]
type = "gw_loss"
loss_weight = 0.15
criterion = "chc_loss"
corner = true

[train.consistency_opt]
type = 'consistency_loss'
loss_weight = 0.25
criterion = 'chc' # 'l1'
blur = true
cosim = true
saturation = 1.0
brightness = 1.0


[logger]
total_iter = 150000
save_checkpoint_freq = 5000
use_tb_logger = true
#save_tb_img = true
print_freq = 500
